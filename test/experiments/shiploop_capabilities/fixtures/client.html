<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthetic Checkers slice</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 2rem; max-width: 44rem; }
  label { display: block; margin: .65rem 0; }
  input { font: inherit; min-width: 14rem; }
  button { font: inherit; padding: .35rem .7rem; }
  pre { background: #f3f3f3; overflow: auto; padding: 1rem; }
</style>
<h1>Synthetic Checkers slice</h1>
<p>This browser is an HTTP client for the local state service. It does not use MCP.</p>
<p id="connection">Loading state…</p>
<label>Actor <input id="actor" value="red" autocomplete="off"></label>
<label>Bearer token <input id="token" type="password" autocomplete="off"></label>
<label>From <input id="from" value="b2" autocomplete="off"></label>
<label>To <input id="to" value="c3" autocomplete="off"></label>
<button id="move" type="button">Move</button>
<pre id="state" aria-live="polite"></pre>
<pre id="result" aria-live="polite"></pre>
<script>
let state;
let sequence = 0;
const output = element => document.querySelector(element);

async function refresh() {
  const response = await fetch('/api/state');
  state = await response.json();
  output('#connection').textContent = `Turn: ${state.turn}; version: ${state.version}`;
  output('#state').textContent = JSON.stringify(state, null, 2);
}

output('#move').addEventListener('click', async () => {
  const request = {
    actor: output('#actor').value,
    from: output('#from').value,
    to: output('#to').value,
    expectedVersion: state.version,
    idempotencyKey: `browser-${Date.now()}-${sequence++}`,
  };
  const response = await fetch('/api/move', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${output('#token').value}`,
    },
    body: JSON.stringify(request),
  });
  const result = await response.json();
  output('#result').textContent = JSON.stringify({status: response.status, result}, null, 2);
  if (response.ok) await refresh();
});

refresh();
</script>
</html>
