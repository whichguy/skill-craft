name: ci
run-name: CI ${{ github.event_name }}

# Every event qualifies the complete hermetic inventory; there is no partial tier.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      groups: ${{ steps.select.outputs.groups }}
      source_sha: ${{ steps.select.outputs.source_sha }}
    steps:
      # Planning compares only HEAD with the event SHA; it needs no history.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Plan full qualification
        id: select
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 -B test/ci_policy.py plan --expected-sha "$EXPECTED_SHA"

  checks:
    name: ${{ needs.plan.outputs.tier }} / ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Hermetic group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: bash test/run-all.sh --group "$TEST_GROUP" --output "$RUNNER_TEMP/hermetic-$TEST_GROUP"
      - name: Plugin views in sync
        if: ${{ always() && matrix.group == 'core' }}
        run: bash scripts/sync-plugin-views.sh --check
      - name: Checkout unchanged
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 -B test/ci_policy.py guard --expected-sha "$EXPECTED_SHA"
      - name: Retain suite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-${{ matrix.group }}
          path: ${{ runner.temp }}/hermetic-${{ matrix.group }}
          if-no-files-found: error

  # Keep the established aggregate name; the plan summary lists every group.
  hermetic:
    if: ${{ always() }}
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected hermetic groups
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          test "$PLAN_RESULT" = success || exit 1
          test "$CHECKS_RESULT" = success || exit 1
          printf 'CI %s passed for `%s`.\n' "$TIER" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
