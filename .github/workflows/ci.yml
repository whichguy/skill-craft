name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [core, shiploop-1, shiploop-2, shiploop-3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Hermetic group
        run: bash test/run-all.sh --group "${{ matrix.group }}"
      - name: Plugin views in sync
        if: ${{ always() && matrix.group == 'core' }}
        run: bash scripts/sync-plugin-views.sh --check
      - name: Tracked checkout unchanged
        if: ${{ always() }}
        shell: bash -e -o pipefail {0}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  # Preserve the existing required-check name; skipped/failed groups cannot pass.
  hermetic:
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all hermetic groups
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
