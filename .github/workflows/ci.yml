name: ci
run-name: CI ${{ github.event_name }} ${{ inputs.tier }}

on:
  push:
    branches: [main]
  pull_request:
  # Weekly full run (Mondays 14:23 UTC, off the hour where GitHub delays schedules): CI floats on the latest runtimes
  # and runner image, which can break it with no commit; a push is otherwise the only thing that finds out.
  schedule:
    - cron: '23 14 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: Quick runs a fixed baseline plus suites matching the last commit; full runs the complete hermetic inventory
        type: choice
        required: true
        default: quick
        options: [quick, full]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      groups: ${{ steps.select.outputs.groups }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Select qualification tier
        id: select
        env:
          REQUESTED_TIER: ${{ inputs.tier }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 -B test/ci_policy.py plan --expected-sha "$EXPECTED_SHA"

  checks:
    name: ${{ needs.plan.outputs.tier }} / ${{ matrix.group }}
    needs: plan
    # actions/setup-python has no CPython 3.9 build for ubuntu-latest (26.04 since 2026-11); 24.04 and 22.04 still do.
    runs-on: ${{ matrix.group == 'python-floor' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          # Quick diffs against the plan's base commit.
          fetch-depth: ${{ needs.plan.outputs.tier == 'quick' && '0' || '1' }}
      - uses: actions/setup-python@v7
        with:
          # The python-floor group runs on the oldest Python ShipLoop declares (shiploop_pyfloor.FLOOR); the rest on the latest.
          python-version: ${{ matrix.group == 'python-floor' && '3.9' || '3.x' }}
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Hermetic group
        env:
          TEST_GROUP: ${{ matrix.group }}
          BASE: ${{ needs.plan.outputs.base }}
          # Stand-in host session markers. ShipLoop's keepalive and Until Loop key their state to the host session,
          # so a suite that leaks that state trips run-all.sh's state-home guard only where those paths run: local
          # runs inside an agent session have real markers, and these give CI the same paths.
          CLAUDECODE: '1'
          CLAUDE_CODE_SESSION_ID: ci-stand-in
        run: |
          set -- --group "$TEST_GROUP" --output "$RUNNER_TEMP/hermetic-$TEST_GROUP"
          if [ "$TEST_GROUP" = quick ] && [ -n "$BASE" ]; then set -- "$@" --changed-from "$BASE"; fi
          bash test/run-all.sh "$@"
      - name: Checkout unchanged
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 -B test/ci_policy.py guard --expected-sha "$EXPECTED_SHA"
      - name: Retain suite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-${{ matrix.group }}
          path: ${{ runner.temp }}/hermetic-${{ matrix.group }}
          if-no-files-found: error

  # These local browser fixtures exercise rendered evidence and RPC correlation.
  # They need Chrome, but no Salesforce org, provider key or model session.
  browser-fixtures:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Prepare browser fixture runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/browser-fixtures"
          npm install --prefix "$RUNNER_TEMP/browser-fixture-runtime" --no-save --package-lock=false --ignore-scripts playwright@latest 2>&1 | tee "$RUNNER_TEMP/browser-fixtures/install.log"
          google-chrome --version | tee "$RUNNER_TEMP/browser-fixtures/chrome-version.log"
      - name: Rendered UI evidence regressions
        shell: bash
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/browser-fixture-runtime/node_modules/playwright
        run: |
          export BROWSER_EXECUTABLE_PATH="$(command -v google-chrome)"
          node --version | tee "$RUNNER_TEMP/browser-fixtures/node-version.log"
          node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE_PATH + "/package.json").version)' | tee "$RUNNER_TEMP/browser-fixtures/playwright-version.log"
          node test/fixtures/grok-chat-full-ui/delayed-setup.cjs 2>&1 | tee "$RUNNER_TEMP/browser-fixtures/delayed-setup.log"
          node test/fixtures/grok-chat-full-ui/setup-save-boundary.cjs 2>&1 | tee "$RUNNER_TEMP/browser-fixtures/setup-save-boundary.log"
          node test/fixtures/grok-chat-full-ui/turn-and-action-correlation.cjs 2>&1 | tee "$RUNNER_TEMP/browser-fixtures/turn-and-action-correlation.log"
          node test/fixtures/grok-chat-full-ui/app-owned-controls.cjs 2>&1 | tee "$RUNNER_TEMP/browser-fixtures/app-owned-controls.log"
      - name: Checkout unchanged
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 -B test/ci_policy.py guard --expected-sha "$EXPECTED_SHA"
      - name: Retain browser fixture evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-fixtures
          path: ${{ runner.temp }}/browser-fixtures
          if-no-files-found: error

  # Versions, plugins/, catalogs and the README inventory change only in
  # release commits (scripts/release.py), whose output is verified against
  # their source; ordinary commits add a change note.
  release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Release output only in release commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "release boundary: not checked for $EVENT_NAME"; exit 0 ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "release boundary: no base commit to compare"; exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::release boundary: base $base is not in this clone; checking HEAD^1..HEAD only"
            base="$(git rev-parse HEAD^1)"
          fi
          python3 -B scripts/check-release-boundary.py --base "$base"

  # Keep the established aggregate name; the plan/summary states its actual tier.
  hermetic:
    if: ${{ always() }}
    needs: [plan, checks, browser-fixtures, release-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected hermetic groups
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser-fixtures.result }}
          BOUNDARY_RESULT: ${{ needs.release-boundary.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          test "$PLAN_RESULT" = success || exit 1
          test "$CHECKS_RESULT" = success || exit 1
          test "$BROWSER_RESULT" = success || exit 1
          test "$BOUNDARY_RESULT" = success || exit 1
          printf 'CI %s passed for `%s`.\n' "$TIER" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
