name: ci
run-name: CI ${{ github.event_name }} ${{ inputs.tier }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Quick runs a fixed baseline plus suites matching the last commit; full runs the complete hermetic inventory
        type: choice
        required: true
        default: quick
        options: [quick, full]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      groups: ${{ steps.select.outputs.groups }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Select qualification tier
        id: select
        env:
          REQUESTED_TIER: ${{ inputs.tier }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 -B test/ci_policy.py plan --expected-sha "$EXPECTED_SHA"

  checks:
    name: ${{ needs.plan.outputs.tier }} / ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          # Quick diffs against the plan's base commit.
          fetch-depth: ${{ needs.plan.outputs.tier == 'quick' && '0' || '1' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Hermetic group
        env:
          TEST_GROUP: ${{ matrix.group }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -- --group "$TEST_GROUP" --output "$RUNNER_TEMP/hermetic-$TEST_GROUP"
          if [ "$TEST_GROUP" = quick ] && [ -n "$BASE" ]; then set -- "$@" --changed-from "$BASE"; fi
          bash test/run-all.sh "$@"
      - name: Checkout unchanged
        if: ${{ always() }}
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.source_sha }}
        run: python3 -B test/ci_policy.py guard --expected-sha "$EXPECTED_SHA"
      - name: Retain suite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hermetic-${{ matrix.group }}
          path: ${{ runner.temp }}/hermetic-${{ matrix.group }}
          if-no-files-found: error

  # Versions, plugins/, catalogs and the README inventory change only in
  # release commits (scripts/release.py), whose output is verified against
  # their source; ordinary commits add a change note.
  release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          check-latest: true
          package-manager-cache: false
      - name: Release output only in release commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "release boundary: not checked for $EVENT_NAME"; exit 0 ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "release boundary: no base commit to compare"; exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::release boundary: base $base is not in this clone; checking HEAD^1..HEAD only"
            base="$(git rev-parse HEAD^1)"
          fi
          python3 -B scripts/check-release-boundary.py --base "$base"

  # Keep the established aggregate name; the plan/summary states its actual tier.
  hermetic:
    if: ${{ always() }}
    needs: [plan, checks, release-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected hermetic groups
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BOUNDARY_RESULT: ${{ needs.release-boundary.result }}
          TIER: ${{ needs.plan.outputs.tier }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          test "$PLAN_RESULT" = success || exit 1
          test "$CHECKS_RESULT" = success || exit 1
          test "$BOUNDARY_RESULT" = success || exit 1
          printf 'CI %s passed for `%s`.\n' "$TIER" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
