<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 2rem auto; text-align: center; }
      #board { display: grid; grid-template-columns: repeat(3, 4.5rem); gap: 0.4rem; justify-content: center; margin: 1rem 0; }
      #board button { width: 4.5rem; height: 4.5rem; font-size: 1.8rem; }
      #status { min-height: 1.5rem; font-weight: 600; }
      #active-player { display: flex; justify-content: center; gap: 0.75rem; margin: 0.5rem 0; }
      #active-player [data-player] {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border: 3px solid #1a1a1a;
        font-weight: 700;
        min-width: 1.5rem;
      }
      #active-player .active {
        background: #f4e27c;
        box-shadow: inset 0 0 0 3px #1a1a1a;
      }
      #board button.legal {
        background: #f4e27c;
        box-shadow: inset 0 0 0 3px #1a1a1a;
      }
    </style>
  </head>
  <body>
    <h1>Tic-Tac-Toe</h1>
    <p id="status" aria-live="polite"></p>
    <div id="active-player" role="group" aria-label="Active player">
      <span data-player="X">X</span>
      <span data-player="O">O</span>
    </div>
    <div id="board" role="grid">
      <button type="button" data-index="0"></button>
      <button type="button" data-index="1"></button>
      <button type="button" data-index="2"></button>
      <button type="button" data-index="3"></button>
      <button type="button" data-index="4"></button>
      <button type="button" data-index="5"></button>
      <button type="button" data-index="6"></button>
      <button type="button" data-index="7"></button>
      <button type="button" data-index="8"></button>
    </div>
    <button type="button" id="new-game">New game</button>
    <?!= include('JavaScript'); ?>
    <script>
      (function () {
        var game = TicTacToe.create();
        var statusEl = document.getElementById('status');
        var cells = document.querySelectorAll('#board [data-index]');
        var badgeX = document.querySelector('#active-player [data-player="X"]');
        var badgeO = document.querySelector('#active-player [data-player="O"]');
        function render() {
          statusEl.textContent = game.message;
          badgeX.className = TicTacToe.badgeClass(game, 'X');
          if (badgeX.className === 'active') {
            badgeX.setAttribute('aria-current', 'true');
          } else {
            badgeX.removeAttribute('aria-current');
          }
          badgeO.className = TicTacToe.badgeClass(game, 'O');
          if (badgeO.className === 'active') {
            badgeO.setAttribute('aria-current', 'true');
          } else {
            badgeO.removeAttribute('aria-current');
          }
          for (var i = 0; i < cells.length; i++) {
            var idx = Number(cells[i].getAttribute('data-index'));
            cells[i].textContent = game.board[idx];
            cells[i].className = TicTacToe.cellClass(game, idx);
          }
        }
        for (var c = 0; c < cells.length; c++) {
          cells[c].addEventListener('click', function (ev) {
            var idx = Number(ev.currentTarget.getAttribute('data-index'));
            TicTacToe.play(game, idx);
            render();
          });
        }
        document.getElementById('new-game').addEventListener('click', function () {
          TicTacToe.newGame(game);
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
